<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>거래일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 설정 화면은 한 열, 거래 화면은 차트·종목 / 주문·뉴스 두 열. 모바일은 한 열에 하단 고정 진행 바.
   색: 한국 증시 관례대로 상승·매수는 빨강, 하락·매도는 파랑. 포인트색은 둘과 겹치지 않는 청록. */
:root {
  --bg: #EDF0F3; --panel: #F8F9FB; --panel2: #EAEEF2; --ink: #121C26; --ink2: #46535F; --muted: #67737F;
  --line: #D8DEE5; --line2: #C3CCD5;
  --accent: #0B7A66; --accent-ink: #FFFFFF; --accent-soft: rgba(11,122,102,.10);
  --up: #D2323A; --down: #2B67D1; --up-soft: rgba(210,50,58,.10); --down-soft: rgba(43,103,209,.10);
  --warn: #8F6200; --warn-soft: rgba(184,125,0,.14);
  --f-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1117; --panel: #131C25; --panel2: #1A2531; --ink: #E8EEF3; --ink2: #AEB9C3; --muted: #8995A1;
    --line: #24303C; --line2: #34424F;
    --accent: #3CC4A5; --accent-ink: #05261F; --accent-soft: rgba(60,196,165,.14);
    --up: #FF5F66; --down: #5F9FFF; --up-soft: rgba(255,95,102,.14); --down-soft: rgba(95,159,255,.14);
    --warn: #E5B24A; --warn-soft: rgba(229,178,74,.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1117; --panel: #131C25; --panel2: #1A2531; --ink: #E8EEF3; --ink2: #AEB9C3; --muted: #8995A1;
  --line: #24303C; --line2: #34424F;
  --accent: #3CC4A5; --accent-ink: #05261F; --accent-soft: rgba(60,196,165,.14);
  --up: #FF5F66; --down: #5F9FFF; --up-soft: rgba(255,95,102,.14); --down-soft: rgba(95,159,255,.14);
  --warn: #E5B24A; --warn-soft: rgba(229,178,74,.16);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 112px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.mute { color: var(--muted); } .sm { font-size: 12.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 버튼 */
.btn { min-height: 42px; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel); font-weight: 500; }
.btn:hover { background: var(--panel2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.buy { background: var(--up); border-color: var(--up); color: #fff; font-weight: 700; }
.btn.sell { background: var(--down); border-color: var(--down); color: #fff; font-weight: 700; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.link { background: none; border: 0; padding: 6px 0; color: var(--ink2); text-decoration: underline; text-underline-offset: 3px; min-height: 36px; }

/* 패널 */
.pn { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.pn h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--ink2); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 6px 12px; min-height: 34px; font-size: 13px; color: var(--ink2); }
.seg button + button { border-left: 1px solid var(--line2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }

/* ===== 설정 화면 ===== */
.hero { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; padding-block: 8px 20px; }
.hero h1 { margin: 0; font: 400 44px/1.05 var(--f-display); letter-spacing: -.01em; }
.hero p { margin: 0; max-width: 40ch; color: var(--ink2); }
.step { margin-top: 26px; }
.step > h2 { margin: 0 0 12px; font-size: 15px; font-weight: 700; display: flex; align-items: baseline; gap: 10px; }
.step > h2 small { font-size: 12.5px; font-weight: 400; color: var(--muted); }
.mgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.mcard { text-align: left; display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); min-width: 0; }
.mcard:hover { border-color: var(--line2); }
.mcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--panel); }
.mcard .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mcard .code { font: 600 11.5px var(--f-num); letter-spacing: .08em; padding: 2px 7px; border: 1px solid var(--line2); border-radius: 4px; color: var(--ink2); }
.mcard .nm { font: 400 24px/1.15 var(--f-display); }
.mcard .kind { font-size: 13px; color: var(--ink2); }
.mcard .desc { font-size: 13.5px; color: var(--ink2); margin: 0; }
.spark { width: 100%; height: 54px; display: block; }
.spark-cap { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: -4px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 12.5px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; text-align: right; font-family: var(--f-num); }
.meter { display: inline-flex; gap: 3px; vertical-align: middle; }
.meter i { width: 14px; height: 6px; border-radius: 2px; background: var(--line2); }
.meter i.on { background: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line2); background: var(--panel); font-size: 14px; }
.chip small { color: var(--muted); margin-left: 4px; font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .75; }
.slider-row { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
.slider-row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; }
.slider-val { min-width: 8.5em; text-align: right; font-size: 14px; }
.seedrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.seedrow input { width: 9.5em; min-height: 40px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel); font-family: var(--f-num); }
.startbar { margin-top: 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 16px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.startbar .sum { font-size: 14px; color: var(--ink2); min-width: 0; }
.startbar .sum b { color: var(--ink); }
.startbar .btn { min-width: 160px; min-height: 50px; font-size: 16px; }
.rec { margin: 22px 0 0; }
.rec h3 { margin: 0 0 8px; font-size: 13px; color: var(--ink2); font-weight: 600; }
.rec ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.rec li { display: flex; gap: 12px; align-items: baseline; font-size: 13.5px; }
.rec li .gd { font: 400 15px var(--f-display); width: 1.2em; }

/* ===== 거래 화면 ===== */
.gh { padding: 14px 16px 16px; }
.gh-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; }
.gh-top .mk { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.gh-top .mk b { font: 400 20px var(--f-display); }
.gh-top .mk span { font: 600 11.5px var(--f-num); letter-spacing: .08em; color: var(--muted); }
.daylabel { font-size: 14px; color: var(--ink2); }
.daylabel b { color: var(--ink); font-family: var(--f-num); }
.prog { height: 6px; border-radius: 3px; margin: 10px 0 14px; background: linear-gradient(90deg, transparent calc(var(--wk, 100%) - 1px), var(--line2) calc(var(--wk, 100%) - 1px)) 0 0 / var(--wk, 100%) 100% repeat-x, var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .35s ease; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px 20px; }
.kpi { min-width: 0; }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi .v { font: 500 17px var(--f-num); white-space: nowrap; }
.kpi.big { grid-column: 1 / -1; }
@media (min-width: 900px) { .kpi.big { grid-column: auto; } .kpis { grid-template-columns: 1.5fr repeat(4, 1fr); } }
.kpi.big .v { font: 400 30px/1.1 var(--f-display); letter-spacing: -.01em; }
.gd.gS, .gd.gA { color: var(--up); } .gd.gB, .gd.gC { color: var(--accent); } .gd.gD, .gd.gF { color: var(--down); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 372px; gap: 14px; margin-top: 14px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.p-chart { order: 1; } .p-stocks { order: 2; } .p-order { order: 3; } .p-news { order: 4; } .p-equity { order: 5; } .p-trades { order: 6; }
@media (max-width: 899px) {
  .cols { display: flex; flex-direction: column; }
  .col { display: contents; }
  .hero h1 { font-size: 38px; }
}
.chart-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 14px; margin-bottom: 8px; }
.chart-head .nm { font: 400 22px/1.15 var(--f-display); }
.chart-head .tk { font: 500 12px var(--f-num); color: var(--muted); margin-left: 6px; letter-spacing: .06em; }
.chart-head .px { font: 500 22px var(--f-num); }
.chart-head .chg { font: 500 13.5px var(--f-num); margin-left: 8px; }
canvas.cv { width: 100%; display: block; touch-action: pan-y; }
#cv-stock { height: 250px; } #cv-equity { height: 190px; } #cv-result { height: 280px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink2); margin-top: 6px; }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2.5px solid; vertical-align: middle; margin-right: 6px; }
.legend i.dash { border-top-style: dashed; }
.srows { display: flex; flex-direction: column; margin: 0 -8px; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(78px, auto); align-items: center; gap: 4px 12px; text-align: left; padding: 9px 8px; background: transparent; border: 0; border-top: 1px solid var(--line); border-radius: 0; }
.srow:first-child { border-top-color: transparent; }
.srow:hover { background: var(--panel2); }
.srow[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.srow .a b { font-weight: 600; } .srow .a span { display: block; font-size: 12px; color: var(--muted); }
.srow .b { text-align: right; } .srow .b .p { font: 500 14.5px var(--f-num); display: block; } .srow .b .c { font: 500 12.5px var(--f-num); }
.srow .h { text-align: right; font: 400 12.5px var(--f-num); color: var(--muted); }
.srow .h b { display: block; font: 500 13px var(--f-num); color: var(--ink); }

/* 주문 */
.o-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.o-top b { font: 400 18px var(--f-display); }
.o-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-bottom: 12px; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; }
.o-seg button { border: 0; background: var(--panel); min-height: 42px; font-weight: 600; color: var(--ink2); }
.o-seg button + button { border-left: 1px solid var(--line2); }
.o-seg button.on-buy { background: var(--up); color: #fff; }
.o-seg button.on-sell { background: var(--down); color: #fff; }
.qty { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 6px; }
.qty button { min-height: 44px; border: 1px solid var(--line2); background: var(--panel); border-radius: 8px; font-size: 20px; line-height: 1; }
.qty input { min-height: 44px; text-align: center; border: 1px solid var(--line2); border-radius: 8px; background: var(--panel); font: 500 18px var(--f-num); min-width: 0; width: 100%; }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0 12px; }
.quick button { min-height: 36px; border: 1px solid var(--line2); background: var(--panel); border-radius: 8px; font-size: 13px; }
.o-info { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 12px; font-size: 13px; }
.o-info dt { color: var(--muted); } .o-info dd { margin: 0; text-align: right; font-family: var(--f-num); }
.o-info .tot { font-weight: 600; border-top: 1px solid var(--line); padding-top: 6px; } .o-info dd.tot { font-size: 15px; }
.o-btn { width: 100%; min-height: 48px; font-size: 15px; }

/* 뉴스, 거래내역 */
.news { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.news li { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.news li:first-child { border-top: 0; padding-top: 2px; }
.news .tag { align-self: start; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: var(--panel2); color: var(--ink2); white-space: nowrap; }
.news .tag.rumor { background: var(--warn-soft); color: var(--warn); }
.news .t { min-width: 0; } .news .t .tone { font-weight: 600; margin-left: 6px; white-space: nowrap; }
.news .when { grid-column: 2; font-size: 12px; color: var(--muted); }
.news li.old { opacity: .72; }
.news-note { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
.tr { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.tr li { display: grid; grid-template-columns: 3.2em 3em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
.tr .d { font-family: var(--f-num); color: var(--muted); }
.tr .sd { font-weight: 700; }
.empty { color: var(--muted); font-size: 13.5px; margin: 0; }

/* 하단 진행 바, 토스트 */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--panel); border-top: 1px solid var(--line2); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.bar-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar-in .info { min-width: 0; font-size: 13px; color: var(--ink2); }
.bar-in .info b { display: block; font: 500 16px var(--f-num); color: var(--ink); white-space: nowrap; }
.bar .btn { min-width: 168px; min-height: 48px; font-size: 15px; }
.toast { position: fixed; left: 50%; transform: translate(-50%, 8px); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 30; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ===== 결과 화면 ===== */
.res-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding: 6px 0 4px; }
.grade { font: 400 96px/0.9 var(--f-display); min-width: 1.1em; }
.grade.gS, .grade.gA { color: var(--up); } .grade.gB, .grade.gC { color: var(--accent); } .grade.gD, .grade.gF { color: var(--down); }
.res-top h1 { margin: 0 0 4px; font: 400 28px/1.15 var(--f-display); }
.res-top p { margin: 0; color: var(--ink2); }
.res-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
.res-kpis .pn .l { font-size: 12px; color: var(--muted); }
.res-kpis .pn .v { font: 500 20px var(--f-num); overflow-wrap: anywhere; }
.res-kpis .pn .s { font-size: 12.5px; color: var(--ink2); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 0 28px; margin: 0; }
.stats div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.stats dt { color: var(--ink2); } .stats dd { margin: 0; text-align: right; font-family: var(--f-num); }
.res-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.res-grid { display: grid; gap: 14px; margin-top: 14px; }
.note { font-size: 13px; color: var(--ink2); margin: 10px 0 0; }
@media (prefers-reduced-motion: reduce) { .prog i, .toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <main id="v-setup"></main>

  <main id="v-game" hidden>
    <header class="pn gh">
      <div class="gh-top">
        <div class="mk"><b id="g-mk"></b><span id="g-code"></span></div>
        <div class="daylabel" id="g-day"></div>
        <button class="link" id="btn-quit" type="button">처음으로</button>
      </div>
      <div class="prog" id="g-prog"><i id="g-prog-i"></i></div>
      <div class="kpis">
        <div class="kpi big"><div class="l">총자산</div><div class="v" id="k-eq"></div></div>
        <div class="kpi"><div class="l">내 수익률</div><div class="v" id="k-ret"></div></div>
        <div class="kpi"><div class="l" id="k-idx-l">지수</div><div class="v" id="k-idx"></div></div>
        <div class="kpi"><div class="l">현금</div><div class="v" id="k-cash"></div></div>
        <div class="kpi"><div class="l">주식 평가액</div><div class="v" id="k-hold"></div></div>
      </div>
    </header>

    <div class="cols">
      <div class="col">
        <section class="pn p-chart" aria-label="종목 차트">
          <div class="chart-head">
            <div>
              <div><span class="nm" id="c-nm"></span><span class="tk" id="c-tk"></span></div>
              <div><span class="px" id="c-px"></span><span class="chg" id="c-chg"></span></div>
            </div>
            <div class="seg" id="c-range" role="group" aria-label="차트 기간">
              <button type="button" data-r="20" aria-pressed="false">20일</button>
              <button type="button" data-r="60" aria-pressed="true">60일</button>
              <button type="button" data-r="0" aria-pressed="false">전체</button>
            </div>
          </div>
          <canvas class="cv" id="cv-stock" role="img" aria-label="선택한 종목의 종가 차트"></canvas>
          <div class="legend"><span><i style="border-color: var(--ink)"></i>종가</span><span class="up">▲ 내 매수</span><span class="down">▼ 내 매도</span><span class="mute">D0 = 개장일</span></div>
        </section>

        <section class="pn p-stocks" aria-label="종목 목록">
          <h2>종목 <span class="mute sm" style="font-weight:400;letter-spacing:0">누르면 차트와 주문이 바뀝니다</span></h2>
          <div class="srows" id="stocks"></div>
        </section>

        <section class="pn p-equity" aria-label="내 자산과 지수">
          <h2>내 자산 vs 지수</h2>
          <canvas class="cv" id="cv-equity" role="img" aria-label="내 자산과 시장 지수의 변화"></canvas>

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeRng(seed) {
  const u = mulberry32(seed);
  let spare = null;
  return {
    u,
    n() {
      if (spare !== null) { const s = spare; spare = null; return s; }
      let a = 0; while (a === 0) a = u();
      const b = u(), m = Math.sqrt(-2 * Math.log(a));
      spare = m * Math.sin(2 * Math.PI * b);
      return m * Math.cos(2 * Math.PI * b);
    },
    pick(arr) { return arr[Math.floor(u() * arr.length)]; },
    range(a, b) { return a + (b - a) * u(); }
  };
}

const getMarket = id => MARKETS.find(m => m.id === id) || MARKETS[0];

/* 호가 단위. 원화 시장은 가격대별 단위, 달러 시장은 센트 단위 */
function tick(mk, p) {
  if (mk.cur.dec === 2) return Math.max(0.01, Math.round(p * 100) / 100);
  const t = p < 1000 ? 1 : p < 5000 ? 5 : p < 10000 ? 10 : p < 50000 ? 50 : p < 100000 ? 100 : p < 500000 ? 500 : 1000;
  return Math.max(1, Math.round(p / t) * t);
}

const HEAD = {
  offPos: ['{n}, 시장 예상을 웃도는 분기 실적 발표', '{n}, 대규모 공급 계약 체결 공시', '{n}, 신제품 판매 호조에 목표주가 줄상향', '{n}, 자사주 매입·소각 결정', '{n}, 주요 고객사와 장기 계약 연장'],
  offNeg: ['{n}, 영업이익 예상치 하회… 실적 부진', '{n}, 주력 제품 리콜 결정', '{n}, 최대주주 지분 매각 공시', '{n}, 규제 당국 조사 착수', '{n}, 유상증자 결정에 투자자 우려'],
  rumPos: ['{n}, 대형 인수합병 임박설 확산', '{n}, 신사업 진출설에 업계 술렁', '{n}, 해외 큰손 지분 확보설 돌아'],
  rumNeg: ['{n}, 핵심 임원 이탈설 확산', '{n}, 납품 지연설에 투자자 불안', '{n}, 감사 의견 관련 불안 소문'],
  secPos: ['{s} 업종, 정책 수혜 기대감 확산', '{s} 업종 수출 지표 호조', '{s} 업종, 증권가 비중 확대 의견 잇따라'],
  secNeg: ['{s} 업종, 원가 부담 확대 우려', '{s} 업종 수요 둔화 신호', '{s} 업종, 규제 강화 가능성 거론'],
  macPos: ['중앙은행, 기준금리 인하 시사', '무역 협상 타결로 투자심리 개선', '경기 선행지수 석 달 연속 개선'],
  macNeg: ['중앙은행, 긴축 기조 유지 발언', '무역 갈등 재점화… 위험회피 심리 확대', '경기 둔화 우려에 외국인 매도세']
};

/* 시장 하나를 통째로 만든다. 같은 시드면 항상 같은 결과.
   world.prices[g][i]: g = 0..HIST+N. 게임 0일차는 g = HIST. */
function simulate(mk, seed, N) {
  const rng = makeRng(seed >>> 0);
  const S = mk.stocks, n = S.length, total = HIST + N;
  const secs = [...new Set(S.map(s => s.sec))];
  const secF = {}; secs.forEach(s => { secF[s] = 0; });
  const extra = Array.from({ length: total + 3 }, () => new Float64Array(n));
  const mktExtra = new Float64Array(total + 3);
  const raw = S.map(s => s.p);
  const fair = S.map(s => Math.log(s.p));
  const prices = [S.map(s => tick(mk, s.p))];
  const news = Array.from({ length: total + 1 }, () => []);
  const REG = [{ mu: 0, vm: 0.85 }, { mu: 0.0011, vm: 0.9 }, { mu: -0.0014, vm: 1.45 }];
  let regime = rng.u() < 0.5 ? 1 : 0;
  const lim = mk.limit == null ? 0.5 : mk.limit;

  const applyStock = (g, i, eff) => { extra[g + 1][i] += eff; extra[g + 2][i] += 0.35 * eff; };
  const fill = (tpl, k, v) => tpl.replace(k, v);

  function makeEvents(g) {
    let cnt = rng.u() < mk.evProb ? 1 : 0;
    if (cnt && rng.u() < 0.15) cnt = 2;
    for (let e = 0; e < cnt; e++) {
      const roll = rng.u();
      const sign = rng.u() < 0.5 ? 1 : -1;
      const mag = rng.range(mk.evMag[0], mk.evMag[1]);
      if (roll < 0.62) {
        const i = Math.floor(rng.u() * n), s = S[i];
        const official = rng.u() < 0.6;
        const real = rng.u() < (official ? 0.82 : 0.5);
        const eff = real ? sign * mag : (rng.u() < 0.5 ? 0 : -0.4 * sign * mag);
        applyStock(g, i, eff);
        const pool = official ? (sign > 0 ? HEAD.offPos : HEAD.offNeg) : (sign > 0 ? HEAD.rumPos : HEAD.rumNeg);
        news[g].push({ g, kind: 'stock', tag: official ? '공시' : '소문', tone: sign, ticker: s.t, text: fill(rng.pick(pool), '{n}', s.n) });
      } else if (roll < 0.82) {
        const sec = rng.pick(secs);
        const eff = (rng.u() < 0.8 ? 1 : 0) * sign * mag * 0.45;
        S.forEach((s, i) => { if (s.sec === sec) applyStock(g, i, eff); });
        news[g].push({ g, kind: 'sector', tag: '업종', tone: sign, sec, text: fill(rng.pick(sign > 0 ? HEAD.secPos : HEAD.secNeg), '{s}', sec) });
      } else {
        const eff = rng.u() < 0.8 ? sign * rng.range(0.006, 0.016) : 0;
        mktExtra[g + 1] += eff; mktExtra[g + 2] += eff * 0.3;
        news[g].push({ g, kind: 'macro', tag: '시황', tone: sign, text: rng.pick(sign > 0 ? HEAD.macPos : HEAD.macNeg) });
      }
    }
  }

  for (let g = 1; g <= total; g++) {
    if (rng.u() < 0.04) { const r = rng.u(); regime = r < 0.40 ? 0 : r < 0.75 ? 1 : 2; }
    const R = REG[regime];
    let m = R.mu + mk.sigma * R.vm * rng.n() + mktExtra[g];
    m = Math.max(-0.08, Math.min(0.08, m));
    for (const s of secs) secF[s] = 0.85 * secF[s] + 0.004 * rng.n();
    const row = [];
    for (let i = 0; i < n; i++) {
      const s = S[i];
      const sys = s.beta * m + secF[s.sec];
      let r = sys + s.vol * rng.n() + s.drift + extra[g][i] - 0.025 * (Math.log(raw[i]) - fair[i]);
      r = Math.max(-lim, Math.min(lim, r));
      raw[i] *= Math.exp(r);
      fair[i] += s.drift + 0.6 * sys + 0.5 * extra[g][i];
      row.push(tick(mk, raw[i]));
    }
    prices.push(row);
    if (g < total) makeEvents(g);
  }

  const wsum = S.reduce((a, s) => a + s.w, 0);
  const idx = prices.map(row => mk.index.base * S.reduce((a, s, i) => a + (s.w / wsum) * row[i] / prices[0][i], 0));
  return { mk, seed, N, H: HIST, total, prices, idx, news };
}

/* ===== 표시용 도우미 ===== */
function fmtNum(v, dec) { return v.toLocaleString('ko-KR', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
function fmtMoney(mk, v) {
  const r = Math.round(v * Math.pow(10, mk.cur.dec)) / Math.pow(10, mk.cur.dec);
  return (r < 0 ? '-' : '') + mk.cur.sym + fmtNum(Math.abs(r), mk.cur.dec);
}
function fmtPct(v, d) {
  d = d == null ? 2 : d;
  const s = (v * 100).toFixed(d);
  const z = Math.abs(v * 100) < Math.pow(10, -d) / 2;
  return (v > 0 && !z ? '+' : '') + (z ? (0).toFixed(d) : s) + '%';
}
function fmtAbs(v, d) { return (v * 100).toFixed(d == null ? 2 : d) + '%'; }
function trim1(x) { return (Math.round(x * 10) / 10).toString(); }
function durLabel(N) {
  if (N < 20) return '약 ' + trim1(N / 5) + '주';
  if (N < 240) return '약 ' + trim1(N / 21) + '개월';
  return '약 1년';
}

/* ===== 게임 규칙: 주문, 하루 진행, 정산, 기록 (DOM 사용 없음) ===== */
let G = null;

function newGame(mkId, N, seed) {
  const mk = getMarket(mkId);
  const W = simulate(mk, seed, N);
  G = {
    mk, W, N, seed, k: 0, cash: mk.cur.start, pos: {}, trades: [], equity: [],
    sel: 0, mode: 'buy', qty: 0, range: 60, ended: false, result: null, saved: false, rank: null
  };
  mk.stocks.forEach(s => { G.pos[s.t] = { qty: 0, cost: 0 }; });
  return G;
}

const gNow = () => G.W.H + G.k;
const priceOf = (i, k) => G.W.prices[G.W.H + (k == null ? G.k : k)][i];
const prevPriceOf = i => G.W.prices[G.W.H + G.k - 1][i];
const rnd = v => { const f = Math.pow(10, G.mk.cur.dec); return Math.round(v * f) / f; };
const holdingsValue = () => G.mk.stocks.reduce((a, s, i) => a + G.pos[s.t].qty * priceOf(i), 0);
const equityNow = () => rnd(G.cash + holdingsValue());
const benchAt = k => G.mk.cur.start * G.W.idx[G.W.H + k] / G.W.idx[G.W.H];

function maxBuy(i) {
  const p = priceOf(i), fb = G.mk.feeBuy;
  let q = Math.floor(G.cash / (p * (1 + fb)));
  while (q > 0 && rnd(q * p) + rnd(q * p * fb) > G.cash + 1e-9) q--;
  return Math.max(0, q);
}
function maxQty(i) { return G.mode === 'buy' ? maxBuy(i) : G.pos[G.mk.stocks[i].t].qty; }
function clampQty() { G.qty = Math.max(0, Math.min(G.qty, maxQty(G.sel))); }

/* 주문 견적. 매수는 합계(지불액), 매도는 정산금(받는 돈) */
function quote(side, i, qty) {
  const mk = G.mk, gross = rnd(qty * priceOf(i));
  if (side === 'buy') {
    const fee = rnd(gross * mk.feeBuy);
    return { gross, fee, total: rnd(gross + fee) };
  }
  const fee = rnd(gross * (mk.feeSell + mk.tax));
  return { gross, fee, total: rnd(gross - fee) };
}

function placeOrder(side, i, qty) {
  if (G.ended) return { ok: false, msg: '이미 정산이 끝났습니다.' };
  qty = Math.floor(qty);
  if (!(qty > 0)) return { ok: false, msg: '수량을 입력해 주세요.' };
  const s = G.mk.stocks[i], pos = G.pos[s.t], p = priceOf(i), q = quote(side, i, qty);
  if (side === 'buy') {
    if (q.total > G.cash + 1e-9) return { ok: false, msg: '현금이 부족합니다.' };
    G.cash = rnd(G.cash - q.total);
    pos.qty += qty; pos.cost = rnd(pos.cost + q.total);
    G.trades.push({ k: G.k, i, t: s.t, n: s.n, side, qty, price: p, fee: q.fee });
  } else {
    if (qty > pos.qty) return { ok: false, msg: '보유 수량보다 많습니다.' };
    const basis = qty === pos.qty ? pos.cost : pos.cost * qty / pos.qty;
    const realized = q.total - basis;
    G.cash = rnd(G.cash + q.total);
    pos.qty -= qty; pos.cost = pos.qty === 0 ? 0 : pos.cost - basis;
    G.trades.push({ k: G.k, i, t: s.t, n: s.n, side, qty, price: p, fee: q.fee, realized, pct: basis > 0 ? realized / basis : 0 });
  }
  clampQty();
  return { ok: true, msg: s.n + ' ' + qty + '주 ' + (side === 'buy' ? '매수' : '매도') + ' 체결 · ' + fmtMoney(G.mk, p) };
}

/* 다음 거래일로. 하루 요약을 돌려준다 */
function advance() {
  if (G.k >= G.N) return null;
  const before = equityNow();
  G.equity.push(before);
  G.k++;
  const g = gNow();
  return { k: G.k, idxChg: G.W.idx[g] / G.W.idx[g - 1] - 1, eqChg: equityNow() / before - 1 };
}

function gradeOf(z) {
  if (z >= 2.0) return { g: 'S', title: '시장을 지배한 큰손' };
  if (z >= 1.2) return { g: 'A', title: '수익 내는 트레이더' };
  if (z >= 0.5) return { g: 'B', title: '꾸준한 투자자' };
  if (z >= 0) return { g: 'C', title: '본전은 지킨 개미' };
  if (z >= -0.8) return { g: 'D', title: '물려버린 투자자' };
  return { g: 'F', title: '깡통 직전' };
}

function finishGame() {
  if (G.ended) return G.result;
  G.equity.push(equityNow());
  G.ended = true;
  const mk = G.mk, start = mk.cur.start, N = G.N;
  const finalEq = G.equity[N];
  const ret = finalEq / start - 1;
  const benchRet = G.W.idx[G.W.H + N] / G.W.idx[G.W.H] - 1;
  let peak = start, mdd = 0;
  [start].concat(G.equity).forEach(v => { peak = Math.max(peak, v); mdd = Math.min(mdd, v / peak - 1); });
  const sells = G.trades.filter(t => t.side === 'sell');
  const wins = sells.filter(t => t.realized > 0).length;
  let best = null, worst = null;
  sells.forEach(t => { if (!best || t.pct > best.pct) best = t; if (!worst || t.pct < worst.pct) worst = t; });
  const open = mk.stocks.map((s, i) => ({ s, i, qty: G.pos[s.t].qty })).filter(o => o.qty > 0);
  const z = ret / (mk.sigma * Math.sqrt(N));
  G.result = {
    finalEq, ret, benchRet, excess: ret - benchRet, mdd,
    trades: G.trades.length, buys: G.trades.length - sells.length, sells: sells.length,
    winRate: sells.length ? wins / sells.length : null,
    best, worst, fees: G.trades.reduce((a, t) => a + t.fee, 0), open,
    z, grade: gradeOf(z)
  };
  return G.result;
}

/* ===== 기록 (이 브라우저에만 저장) ===== */
const REC_KEY = 'georaeilji.records.v1';
function loadRecords() {
  try { const a = JSON.parse(localStorage.getItem(REC_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; }
}
function saveRecord() {
  if (G.saved || !G.result) return;
  G.saved = true;
  const r = { m: G.mk.id, n: G.N, ret: G.result.ret, eq: G.result.finalEq, g: G.result.grade.g, seed: G.seed, ts: Date.now() };
  try {
    const all = loadRecords(); all.push(r);
    all.sort((a, b) => b.ret - a.ret);
    localStorage.setItem(REC_KEY, JSON.stringify(all.slice(0, 80)));
  } catch (e) { /* 저장 불가 환경에서는 건너뜀 */ }
  const same = loadRecords().filter(x => x.m === r.m && x.n === r.n);
  const at = same.findIndex(x => x.ts === r.ts);
  G.rank = at >= 0 ? at + 1 : null;
}
function topRecords(mkId, N) {
  return loadRecords().filter(x => x.m === mkId && x.n === N).slice(0, 5);
}

/* 열려 있는 화면을 새로 배포해도 이어서 할 수 있게 하는 스냅샷 */
function snapshotGame() {
  if (!G) return null;
  return { m: G.mk.id, N: G.N, seed: G.seed, k: G.k, cash: G.cash, pos: G.pos, trades: G.trades, equity: G.equity, sel: G.sel, mode: G.mode, qty: G.qty, range: G.range, ended: G.ended };
}
function restoreGame(d) {
  newGame(d.m, d.N, d.seed);
  Object.assign(G, { k: d.k, cash: d.cash, pos: d.pos, trades: d.trades, equity: d.equity, sel: d.sel, mode: d.mode, qty: d.qty, range: d.range });
  if (d.ended) { G.equity.pop(); G.ended = false; finishGame(); }
}

/* ===== 캔버스 차트 (색은 현재 테마의 CSS 변수에서 읽는다) ===== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function rgba(hex, a) {
  const m = /^#([0-9a-f]{6})$/i.exec(hex);
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  return 'rgba(' + (n >> 16) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
}
function prepCanvas(cv) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return null;
  const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
  if (cv.width !== pw) cv.width = pw;
  if (cv.height !== ph) cv.height = ph;
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);
  return { c, w, h };
}
function niceTicks(lo, hi, cnt) {
  const raw = (hi - lo) / cnt;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const nr = raw / mag;
  const step = (nr < 1.5 ? 1 : nr < 3 ? 2 : nr < 7 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return { ticks: out, step };
}
function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}

/* o: { series:[{data,color,width,dash,fill}], fmtY(v,step), xLabel(i), vline:{i,label}, markers:[{i,v,side}], hover, tip(i) } */
function drawLines(cv, o) {
  const P = prepCanvas(cv); if (!P) return;
  const c = P.c, w = P.w, h = P.h;
  const muted = cssv('--muted'), line = cssv('--line'), line2 = cssv('--line2'), panel = cssv('--panel'), ink = cssv('--ink');
  const up = cssv('--up'), down = cssv('--down'), fnum = cssv('--f-num');
  const n = o.series[0].data.length;
  let lo = Infinity, hi = -Infinity;
  o.series.forEach(s => s.data.forEach(v => { if (v < lo) lo = v; if (v > hi) hi = v; }));
  if (hi === lo) { const d = Math.abs(hi) * 0.01 || 1; hi += d; lo -= d; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  c.font = '11.5px ' + fnum;
  const nt = niceTicks(lo, hi, 4);
  const labels = nt.ticks.map(t => o.fmtY(t, nt.step));
  const tw = Math.max.apply(null, labels.map(s => c.measureText(s).width).concat([28]));
  const L = 6, R = Math.ceil(tw) + 12, T = 12, B = 24;
  const pw = w - L - R, ph = h - T - B;
  const xOf = i => L + (n <= 1 ? pw / 2 : i * pw / (n - 1));
  const yOf = v => T + (hi - v) / (hi - lo) * ph;
  cv._geo = { L, R, w, n };

  c.lineWidth = 1; c.textBaseline = 'middle'; c.textAlign = 'left';
  nt.ticks.forEach((t, k) => {
    const y = Math.round(yOf(t)) + 0.5;
    c.strokeStyle = line; c.beginPath(); c.moveTo(L, y); c.lineTo(w - R, y); c.stroke();
    c.fillStyle = muted; c.fillText(labels[k], w - R + 8, y);
  });
  c.textBaseline = 'top';
  const nx = Math.min(5, n);
  for (let j = 0; j < nx; j++) {
    const i = nx === 1 ? 0 : Math.round(j * (n - 1) / (nx - 1));
    c.textAlign = nx === 1 ? 'center' : j === 0 ? 'left' : j === nx - 1 ? 'right' : 'center';
    c.fillStyle = muted;
    c.fillText(o.xLabel(i), j === 0 && nx > 1 ? L : j === nx - 1 && nx > 1 ? w - R : xOf(i), h - B + 7);
  }
  if (o.vline) {
    const x = Math.round(xOf(o.vline.i)) + 0.5;
    c.strokeStyle = line2; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(x, T); c.lineTo(x, T + ph); c.stroke(); c.setLineDash([]);
    c.fillStyle = muted; c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText(o.vline.label, x + 4, T + 2);
  }
  o.series.forEach(s => {
    const d = s.data;
    if (s.fill && n > 1) {
      const gr = c.createLinearGradient(0, T, 0, T + ph);
      gr.addColorStop(0, rgba(s.color, 0.16)); gr.addColorStop(1, rgba(s.color, 0));
      c.beginPath();
      d.forEach((v, i) => { if (i) c.lineTo(xOf(i), yOf(v)); else c.moveTo(xOf(i), yOf(v)); });
      c.lineTo(xOf(n - 1), T + ph); c.lineTo(xOf(0), T + ph); c.closePath();
      c.fillStyle = gr; c.fill();
    }
    c.lineWidth = s.width || 2; c.lineJoin = 'round'; c.lineCap = 'round'; c.strokeStyle = s.color;
    c.setLineDash(s.dash || []);
    c.beginPath();
    d.forEach((v, i) => { if (i) c.lineTo(xOf(i), yOf(v)); else c.moveTo(xOf(i), yOf(v)); });
    c.stroke(); c.setLineDash([]);
  });
  (o.markers || []).forEach(m => {
    const x = xOf(m.i), y = yOf(m.v), s = 5.5;
    c.beginPath();
    if (m.side === 'buy') { const yy = y + 9; c.moveTo(x, yy - s); c.lineTo(x - s, yy + s - 1); c.lineTo(x + s, yy + s - 1); c.fillStyle = up; }
    else { const yy = y - 9; c.moveTo(x, yy + s); c.lineTo(x - s, yy - s + 1); c.lineTo(x + s, yy - s + 1); c.fillStyle = down; }
    c.closePath(); c.fill(); c.lineWidth = 1.5; c.strokeStyle = panel; c.stroke();
  });
  const dot = (x, y, col) => { c.beginPath(); c.arc(x, y, 4.5, 0, 7); c.fillStyle = col; c.fill(); c.lineWidth = 2; c.strokeStyle = panel; c.stroke(); };
  o.series.forEach(s => dot(xOf(n - 1), yOf(s.data[n - 1]), s.color));

  const hv = o.hover;
  if (hv != null && hv >= 0 && hv < n && o.tip) {
    const x = xOf(hv);
    c.strokeStyle = line2; c.lineWidth = 1; c.beginPath(); c.moveTo(Math.round(x) + 0.5, T); c.lineTo(Math.round(x) + 0.5, T + ph); c.stroke();
    o.series.forEach(s => dot(x, yOf(s.data[hv]), s.color));
    const tip = o.tip(hv);
    c.font = '12px ' + fnum;
    const lines = [tip.title].concat(tip.rows.map(r => r.label + '  ' + r.text));
    const bw = Math.max.apply(null, lines.map(s => c.measureText(s).width)) + 28, lh = 17, bh = lines.length * lh + 12;
    let bx = x + 12; if (bx + bw > w - R + 4) bx = x - 12 - bw; if (bx < 2) bx = 2;
    roundRectPath(c, bx, T + 2, bw, bh, 6); c.fillStyle = panel; c.fill(); c.strokeStyle = line2; c.lineWidth = 1; c.stroke();
    c.textAlign = 'left'; c.textBaseline = 'middle';
    c.fillStyle = muted; c.fillText(tip.title, bx + 10, T + 2 + 6 + lh / 2);
    tip.rows.forEach((r, k) => {
      const yy = T + 2 + 6 + lh * (k + 1) + lh / 2;
      c.strokeStyle = r.color; c.lineWidth = 2.5; c.beginPath(); c.moveTo(bx + 10, yy); c.lineTo(bx + 18, yy); c.stroke();
      c.fillStyle = ink; c.fillText(r.label + '  ' + r.text, bx + 22, yy);
    });
  }
}

function attachHover(cv, redraw) {
  const move = e => {
    const g = cv._geo; if (!g) return;
    const x = e.clientX - cv.getBoundingClientRect().left;
    let i = Math.round((x - g.L) / (g.w - g.L - g.R) * (g.n - 1));
    i = Math.max(0, Math.min(g.n - 1, i));
    if (cv._hover !== i) { cv._hover = i; redraw(); }
  };
  cv.addEventListener('pointermove', move);
  cv.addEventListener('pointerdown', move);
  cv.addEventListener('pointerleave', () => { cv._hover = null; redraw(); });
  cv.addEventListener('pointerup', e => { if (e.pointerType === 'touch') setTimeout(() => { cv._hover = null; redraw(); }, 1600); });
}

/* ===== 이 게임 전용 차트 ===== */
const dLabel = d => d === 0 ? 'D0' : d > 0 ? 'D+' + d : 'D' + d;
function fmtAxis(mk, v, step) {
  if (mk.cur.dec === 0) {
    if (Math.abs(v) >= 1e8) return fmtNum(v / 1e8, 2) + '억';
    return fmtNum(v / 1e4, step < 1e4 ? 1 : 0) + '만';
  }
  return v >= 1000 ? '$' + fmtNum(v / 1000, step < 1000 ? 2 : 1) + 'k' : '$' + fmtNum(v, step < 1 ? 2 : 0);
}

function drawStockChart() {
  const cv = $('#cv-stock'), mk = G.mk, i = G.sel, g = gNow(), H = G.W.H;
  const start = G.range ? Math.max(0, g - G.range + 1) : 0;
  const data = [];
  for (let gg = start; gg <= g; gg++) data.push(G.W.prices[gg][i]);
  const markers = G.trades.filter(t => t.i === i).map(t => ({ i: H + t.k - start, v: t.price, side: t.side })).filter(m => m.i >= 0);
  const vi = H - start;
  drawLines(cv, {
    series: [{ data, color: cssv('--ink'), width: 2, fill: true }],
    fmtY: v => fmtNum(v, mk.cur.dec),
    xLabel: j => dLabel(start + j - H),
    vline: vi > 0 && vi < data.length - 1 ? { i: vi, label: 'D0' } : null,
    markers, hover: cv._hover,
    tip: j => {
      const gg = start + j, p = G.W.prices[gg][i], pv = gg > 0 ? G.W.prices[gg - 1][i] : p;
      return { title: dLabel(gg - H), rows: [
        { label: '종가', text: fmtMoney(mk, p), color: cssv('--ink') },
        { label: '전일비', text: fmtPct(p / pv - 1), color: cssv('--muted') }
      ] };
    }
  });
}

function equitySeries(eqArr) {
  const bench = eqArr.map((_, k) => benchAt(k));
  return { mine: eqArr, bench };
}
function drawEquityChart(cv, eqArr, hover) {
  const mk = G.mk, S = equitySeries(eqArr), start = mk.cur.start;
  drawLines(cv, {
    series: [
      { data: S.bench, color: cssv('--muted'), width: 2, dash: [5, 4] },
      { data: S.mine, color: cssv('--accent'), width: 2.5, fill: true }
    ],
    fmtY: (v, step) => fmtAxis(mk, v, step),
    xLabel: j => j === 0 ? '개장' : j + '일',
    hover,
    tip: j => ({ title: j === 0 ? '개장일' : j + '일차', rows: [
      { label: '내 자산', text: fmtMoney(mk, S.mine[j]) + ' ' + fmtPct(S.mine[j] / start - 1, 1), color: cssv('--accent') },
      { label: '지수', text: fmtMoney(mk, S.bench[j]) + ' ' + fmtPct(S.bench[j] / start - 1, 1), color: cssv('--muted') }
    ] })
  });
}

function sparkSvg(pts) {

}

  $$('#chips .chip').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.n === UI.N)));
  $('#n-range').value = UI.N;
  $('#n-val').textContent = UI.N + '거래일 · ' + durLabel(UI.N);
  const mk = getMarket(UI.mkId);
  $('#sum').innerHTML = '<b>' + mk.name + '</b> · ' + UI.N + '거래일(' + durLabel(UI.N) + ') · 시작 자금 ' + fmtMoney(mk, mk.cur.start);
  renderRecords();
}
function renderRecords() {
  const box = $('#rec'), list = topRecords(UI.mkId, UI.N);
  if (!list.length) { box.innerHTML = ''; return; }
  box.innerHTML = '<h3>이 설정의 내 기록</h3><ol>' + list.map(r =>
    '<li><span class="gd g' + r.g + '">' + r.g + '</span><span class="num ' + dir(r.ret) + '">' + fmtPct(r.ret) + '</span><span class="mute sm">시장 #' + r.seed + ' · ' + new Date(r.ts).toLocaleDateString('ko-KR') + '</span></li>').join('') + '</ol>';
}

function initSetup() {
  const el = $('#v-setup');
  el.addEventListener('click', e => {
    const card = e.target.closest('.mcard');
    if (card) { UI.mkId = card.dataset.m; refreshSetup(); return; }
    const chip = e.target.closest('.chip');
    if (chip) { UI.N = +chip.dataset.n; refreshSetup(); return; }
    if (e.target.closest('#seed-new')) { UI.seed = randSeed(); $('#seed-in').value = UI.seed; renderMarketCards(); refreshSetup(); return; }
    if (e.target.closest('#start')) startGame();
  });
  el.addEventListener('input', e => {
    if (e.target.id === 'n-range') { UI.N = +e.target.value; refreshSetup(); }
    if (e.target.id === 'seed-in') {
      const v = parseInt(e.target.value, 10);
      if (v > 0 && v <= 9999999) { UI.seed = v; renderMarketCards(); refreshSetup(); }
    }
  });
}

/* ===== 화면: 거래, 정산, 시작 ===== */
function showScreen(s) {
  UI.screen = s;
  $('#v-setup').hidden = s !== 'setup';
  $('#v-game').hidden = s !== 'game';
  $('#v-result').hidden = s !== 'result';
  $('#bar').hidden = s !== 'game';
  window.scrollTo(0, 0);
  requestAnimationFrame(redrawCharts);
}
function redrawCharts() {
  if (!G) return;
  if (UI.screen === 'game') { drawStockChart(); drawGameEquity(); }
  else if (UI.screen === 'result') drawResultChart();
}
function drawGameEquity() { const cv = $('#cv-equity'); drawEquityChart(cv, G.equity.concat([equityNow()]), cv._hover); }
function drawResultChart() { const cv = $('#cv-result'); if (cv) drawEquityChart(cv, G.equity, cv._hover); }

function startGame(keepSeed) {
  newGame(UI.mkId, UI.N, UI.seed);
  $$('#c-range button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.r === G.range)));
  showScreen('game');
  renderGame();
  $('#cv-stock')._hover = null; $('#cv-equity')._hover = null;
}

function renderGame() {
  renderHeader(); renderStocks(); renderChartHead(); renderOrder(); renderNews(); renderTrades(); renderBar();
  redrawCharts();
}

function renderHeader() {
  const mk = G.mk, k = G.k, N = G.N, g = gNow(), H = G.W.H;
  const eq = equityNow(), ret = eq / mk.cur.start - 1, ir = G.W.idx[g] / G.W.idx[H] - 1;
  $('#g-mk').textContent = mk.name; $('#g-code').textContent = mk.code;
  $('#g-day').innerHTML = k === 0 ? '<b>개장 전</b> · 첫 주문을 넣어 보세요' : '<b>' + k + '</b>/' + N + '일 · ' + Math.ceil(k / 5) + '주차 ' + WD[(k - 1) % 5] + '요일';
  const prog = $('#g-prog'); prog.style.setProperty('--wk', ((N > 100 ? 21 : 5) / N * 100) + '%');
  $('#g-prog-i').style.width = (k / N * 100) + '%';
  $('#k-eq').textContent = fmtMoney(mk, eq);
  $('#k-ret').innerHTML = '<span class="' + dir(ret) + '">' + arr(ret) + fmtAbs(Math.abs(ret)) + '</span>';
  $('#k-idx-l').textContent = mk.index.name + ' (개장 대비)';
  $('#k-idx').innerHTML = '<span class="' + dir(ir) + '">' + arr(ir) + fmtAbs(Math.abs(ir)) + '</span>';
  $('#k-cash').textContent = fmtMoney(mk, G.cash);
  $('#k-hold').textContent = fmtMoney(mk, holdingsValue());
}

function renderStocks() {
  const mk = G.mk, dec = mk.cur.dec;
  $('#stocks').innerHTML = mk.stocks.map((s, i) => {
    const p = priceOf(i), pv = G.k > 0 ? prevPriceOf(i) : G.W.prices[G.W.H - 1][i], ch = p / pv - 1, pos = G.pos[s.t];
    const hold = pos.qty ? '<b>' + fmtNum(pos.qty, 0) + '주</b><span class="' + dir(p * pos.qty / pos.cost - 1) + '">' + arr(p * pos.qty / pos.cost - 1) + fmtAbs(Math.abs(p * pos.qty / pos.cost - 1), 1) + '</span>' : '<span>–</span>';
    return '<button type="button" class="srow" data-i="' + i + '" aria-pressed="' + (i === G.sel) + '">' +
      '<div class="a"><b>' + s.n + '</b><span>' + s.t + ' · ' + s.sec + '</span></div>' +
      '<div class="b"><span class="p">' + fmtNum(p, dec) + '</span><span class="c ' + dir(ch) + '">' + arr(ch) + (Math.abs(ch) * 100).toFixed(2) + '%</span></div>' +
      '<div class="h">' + hold + '</div></button>';
  }).join('');
}

function renderChartHead() {
  const mk = G.mk, i = G.sel, s = mk.stocks[i], p = priceOf(i), pv = G.k > 0 ? prevPriceOf(i) : G.W.prices[G.W.H - 1][i], ch = p / pv - 1;
  $('#c-nm').textContent = s.n; $('#c-tk').textContent = s.t + ' · ' + s.sec;
  $('#c-px').textContent = fmtMoney(mk, p);
  $('#c-chg').innerHTML = '<span class="' + dir(ch) + '">' + arr(ch) + fmtAbs(Math.abs(ch)) + '</span>';
}

function renderOrder(keepInput) {
  const mk = G.mk, i = G.sel, s = mk.stocks[i], p = priceOf(i), pos = G.pos[s.t], buy = G.mode === 'buy';
  clampQty();
  $('#o-nm').textContent = s.n; $('#o-px').textContent = fmtMoney(mk, p);
  $('#o-buy').className = buy ? 'on-buy' : ''; $('#o-sell').className = buy ? '' : 'on-sell';
  $('#o-buy').setAttribute('aria-pressed', String(buy)); $('#o-sell').setAttribute('aria-pressed', String(!buy));
  if (!keepInput) $('#o-qty').value = G.qty;
  const q = quote(G.mode, i, G.qty);
  let h = '';
  if (buy) h += '<dt>살 수 있는 수량</dt><dd>최대 ' + fmtNum(maxBuy(i), 0) + '주</dd>';
  else h += '<dt>보유</dt><dd>' + (pos.qty ? fmtNum(pos.qty, 0) + '주 · 평균 ' + fmtMoney(mk, pos.cost / pos.qty) : '없음') + '</dd>';
  h += '<dt>주문 금액</dt><dd>' + fmtMoney(mk, q.gross) + '</dd>';
  h += '<dt>' + (buy ? '수수료' : '수수료·세금') + '</dt><dd>' + fmtMoney(mk, q.fee) + '</dd>';
  h += '<dt class="tot">' + (buy ? '지불 합계' : '받는 금액') + '</dt><dd class="tot">' + fmtMoney(mk, q.total) + '</dd>';
  $('#o-info').innerHTML = h;
  const go = $('#o-go');
  go.className = 'btn o-btn ' + (buy ? 'buy' : 'sell');
  go.disabled = !(G.qty > 0);
  go.textContent = G.qty > 0 ? s.n + ' ' + fmtNum(G.qty, 0) + '주 ' + (buy ? '매수' : '매도') : (maxQty(i) > 0 ? '수량을 정하세요' : buy ? '살 수 있는 수량이 없습니다' : '팔 수 있는 주식이 없습니다');
}

function renderNews() {
  const g = gNow(), H = G.W.H, items = [];
  for (let d = 0; d <= 3; d++) {
    const gg = g - d; if (gg < H) break;
    (G.W.news[gg] || []).forEach(n => items.push({ n, d }));
  }
  const today = items.filter(x => x.d === 0).length;
  let h = '';
  if (!today) h += '<li style="display:block"><p class="empty">' + (G.k >= G.N ? '마지막 거래일입니다. 보유 주식은 오늘 종가로 정산됩니다.' : '오늘은 눈에 띄는 소식이 없습니다.') + '</p></li>';
  h += items.map(x => {
    const n = x.n, rumor = n.tag === '소문';
    return '<li class="' + (x.d ? 'old' : '') + '"><span class="tag ' + (rumor ? 'rumor' : '') + '">' + n.tag + '</span>' +
      '<span class="t">' + esc(n.text) + '<span class="tone ' + (n.tone > 0 ? 'up' : 'down') + '">' + (n.tone > 0 ? '▲ 호재' : '▼ 악재') + '</span></span>' +
      '<span class="when">' + (x.d === 0 ? '오늘' : x.d + '일 전') + '</span></li>';
  }).join('');
  $('#news').innerHTML = h;
}

function renderTrades() {
  const list = G.trades.slice(-6).reverse(), mk = G.mk;
  $('#tr-count').textContent = G.trades.length ? '총 ' + G.trades.length + '건' : '';
  $('#trades').innerHTML = list.length ? list.map(t =>
    '<li><span class="d">D' + t.k + '</span><span class="sd ' + (t.side === 'buy' ? 'up' : 'down') + '">' + (t.side === 'buy' ? '매수' : '매도') + '</span>' +
    '<span>' + esc(t.n) + ' ' + fmtNum(t.qty, 0) + '주 · ' + fmtNum(t.price, mk.cur.dec) + '</span>' +
    '<span class="num ' + (t.side === 'sell' ? dir(t.realized) : '') + '">' + (t.side === 'sell' ? fmtPct(t.pct, 1) : '') + '</span></li>').join('')
    : '<li style="display:block"><p class="empty">아직 거래가 없습니다.</p></li>';
}

function renderBar() {
  const mk = G.mk;
  $('#b-lbl').textContent = G.k === 0 ? '시작 자금' : '총자산';
  $('#b-eq').textContent = fmtMoney(mk, equityNow());
  $('#b-next').textContent = G.k === 0 ? '개장 ▶' : G.k < G.N ? '다음 거래일 ▶' : '장 마감 · 정산';
}

function onNext() {
  if (G.k >= G.N) { finishAndShow(); return; }
  const s = advance();
  clampQty();
  $('#cv-stock')._hover = null; $('#cv-equity')._hover = null;
  renderGame();
  toast(s.k + '일차 · ' + G.mk.index.code + ' ' + fmtPct(s.idxChg) + ' · 내 자산 ' + fmtPct(s.eqChg) + (G.k >= G.N ? ' · 마지막 거래일입니다' : ''));
}

function onOrder() {
  const r = placeOrder(G.mode, G.sel, G.qty);
  if (r.ok) { G.qty = 0; renderGame(); }
  toast(r.msg);
}

function initGame() {
  attachHover($('#cv-stock'), drawStockChart);
  attachHover($('#cv-equity'), drawGameEquity);
  $('#stocks').addEventListener('click', e => {
    const b = e.target.closest('.srow'); if (!b) return;
    G.sel = +b.dataset.i; G.qty = 0; $('#cv-stock')._hover = null;
    renderStocks(); renderChartHead(); renderOrder(); drawStockChart();
  });
  $('#c-range').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    G.range = +b.dataset.r;
    $$('#c-range button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    $('#cv-stock')._hover = null; drawStockChart();
  });
  $('#o-buy').addEventListener('click', () => { G.mode = 'buy'; renderOrder(); });
  $('#o-sell').addEventListener('click', () => { G.mode = 'sell'; renderOrder(); });
  $('#q-dec').addEventListener('click', () => { G.qty = Math.max(0, G.qty - 1); renderOrder(); });
  $('#q-inc').addEventListener('click', () => { G.qty = G.qty + 1; renderOrder(); });
  $('#o-quick').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const max = maxQty(G.sel), pct = +b.dataset.p;
    G.qty = max > 0 ? (pct >= 1 ? max : Math.max(1, Math.floor(max * pct))) : 0;
    renderOrder();
  });
  $('#o-qty').addEventListener('input', e => {
    const v = parseInt(e.target.value, 10);
    G.qty = isNaN(v) ? 0 : Math.max(0, v);
    renderOrder(true);
  });
  $('#o-qty').addEventListener('change', () => renderOrder());
  $('#o-qty').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('#o-go').disabled) onOrder(); });
  $('#o-go').addEventListener('click', onOrder);
  $('#b-next').addEventListener('click', onNext);
  let quitT = null;
  $('#btn-quit').addEventListener('click', e => {
    const b = e.currentTarget;
    if (quitT) { clearTimeout(quitT); quitT = null; b.textContent = '처음으로'; G = null; showScreen('setup'); renderSetup(); return; }
    b.textContent = '한 번 더 누르면 이 게임을 그만둡니다';
    quitT = setTimeout(() => { quitT = null; b.textContent = '처음으로'; }, 3000);
  });
}

/* ===== 정산 ===== */
function finishAndShow() {
  finishGame(); saveRecord();
  renderResult(); showScreen('result');
}
function renderResult() {
  const mk = G.mk, r = G.result, start = mk.cur.start, N = G.N;
  const rec = topRecords(mk.id, N);
  const openTxt = r.open.length ? '정산 시점에 들고 있던 ' + r.open.map(o => esc(o.s.n) + ' ' + fmtNum(o.qty, 0) + '주').join(', ') + '은(는) 마지막 종가로 평가했습니다.' : '';
  $('#v-result').innerHTML =
    '<div class="res-top"><div class="grade g' + r.grade.g + '" aria-label="등급 ' + r.grade.g + '">' + r.grade.g + '</div>' +
    '<div><h1>' + r.grade.title + '</h1><p>' + mk.name + ' · ' + N + '거래일(' + durLabel(N) + ') · 시장 #' + G.seed + (G.rank ? ' · 이 설정 내 기록 ' + G.rank + '위' : '') + '</p></div></div>' +
    '<div class="res-kpis">' +
    '<div class="pn"><div class="l">최종 자산</div><div class="v">' + fmtMoney(mk, r.finalEq) + '</div><div class="s">시작 ' + fmtMoney(mk, start) + '</div></div>' +
    '<div class="pn"><div class="l">내 수익률</div><div class="v ' + dir(r.ret) + '">' + arr(r.ret) + fmtAbs(Math.abs(r.ret)) + '</div><div class="s">손익 ' + fmtMoney(mk, r.finalEq - start) + '</div></div>' +
    '<div class="pn"><div class="l">지수 수익률</div><div class="v ' + dir(r.benchRet) + '">' + arr(r.benchRet) + fmtAbs(Math.abs(r.benchRet)) + '</div><div class="s">' + mk.index.name + '</div></div>' +
    '<div class="pn"><div class="l">지수 대비</div><div class="v ' + dir(r.excess) + '">' + fmtPp(r.excess) + '</div><div class="s">' + (r.excess >= 0 ? '시장을 앞섰습니다' : '시장에 뒤처졌습니다') + '</div></div></div>' +
    '<div class="res-grid">' +
    '<section class="pn"><h2>내 자산 vs 지수</h2><canvas class="cv" id="cv-result" role="img" aria-label="내 자산과 지수의 변화"></canvas>' +
    '<div class="legend"><span><i style="border-color: var(--accent)"></i>내 자산</span><span><i class="dash" style="border-color: var(--muted)"></i>지수에 그대로 투자했다면</span></div></section>' +
    '<section class="pn"><h2>매매 돌아보기</h2><dl class="stats">' +
    '<div><dt>최대 낙폭</dt><dd class="' + dir(r.mdd) + '">' + fmtPct(r.mdd) + '</dd></div>' +
    '<div><dt>거래 횟수</dt><dd>' + r.trades + '회 (매수 ' + r.buys + ' · 매도 ' + r.sells + ')</dd></div>' +
    '<div><dt>승률 (매도 기준)</dt><dd>' + (r.winRate == null ? '–' : Math.round(r.winRate * 100) + '%') + '</dd></div>' +
    '<div><dt>수수료·세금 합계</dt><dd>' + fmtMoney(mk, r.fees) + '</dd></div>' +
    '<div><dt>가장 좋은 매도</dt><dd>' + (r.best ? esc(r.best.n) + ' ' + fmtPct(r.best.pct, 1) : '–') + '</dd></div>' +
    '<div><dt>가장 나쁜 매도</dt><dd>' + (r.worst ? esc(r.worst.n) + ' ' + fmtPct(r.worst.pct, 1) : '–') + '</dd></div></dl>' +
    '<p class="note">등급은 이 시장의 변동성과 기간을 감안한 수익률로 매깁니다. ' + openTxt + '</p></section>' +
    (rec.length ? '<section class="pn"><div class="rec" style="margin:0"><h3>이 설정의 내 기록</h3><ol>' + rec.map(x =>
      '<li><span class="gd g' + x.g + '">' + x.g + '</span><span class="num ' + dir(x.ret) + '">' + fmtPct(x.ret) + '</span><span class="mute sm">시장 #' + x.seed + ' · ' + new Date(x.ts).toLocaleDateString('ko-KR') + '</span></li>').join('') + '</ol></div></section>' : '') +
    '</div>' +
    '<div class="res-actions"><button type="button" class="btn primary" id="r-new">새 시장에서 다시</button><button type="button" class="btn" id="r-same">같은 시장 다시 도전</button><button type="button" class="btn" id="r-setup">설정 바꾸기</button></div>';
  attachHover($('#cv-result'), drawResultChart);
  $('#r-new').onclick = () => { UI.seed = randSeed(); startGame(); };
  $('#r-same').onclick = () => startGame();
  $('#r-setup').onclick = () => { G = null; showScreen('setup'); renderSetup(); };
}

/* ===== 시작 ===== */
function boot(data) {
  initSetup(); initGame();
  let restored = false;
  try {
    if (data && data.screen && data.ui) {
      Object.assign(UI, data.ui);
      if (data.game && data.screen !== 'setup') {
        restoreGame(data.game);
        if (G.ended) { renderResult(); showScreen('result'); } else { showScreen('game'); renderGame(); }
        restored = true;
      }
    }
  } catch (e) { restored = false; G = null; }
  if (!restored) { renderSetup(); showScreen('setup'); }

  let rt = 0;
  const again = () => { cancelAnimationFrame(rt); rt = requestAnimationFrame(redrawCharts); };
  window.addEventListener('resize', again);
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', again); } catch (e) { /* 구형 브라우저 */ }
  try { new MutationObserver(again).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) { /* 무시 */ }
}

(function () {
  const hot = window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(() => ({ screen: UI.screen, ui: { mkId: UI.mkId, N: UI.N, seed: UI.seed }, game: snapshotGame() })); } catch (e) { /* 무시 */ }
  const go = d => boot(d || {});
  if (hot && hot.ready) hot.ready(go); else go(hot && hot.data);
})();
</script>
</body>
</html>
